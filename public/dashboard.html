<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ListaDo - Dashboard</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/utils.css">
</head>

<body>

    <!-- ==================== BARRA DE NAVEGACIÓN ==================== -->
    <nav class="navbar">
        <div class="nav-brand">
            <h1>ListaDo 📝</h1>
        </div>

        <div class="nav-user">
            <span id="user-name">Cargando...</span>
            <button id="logout-btn" class="btn-logout">Cerrar Sesión</button>
        </div>

        <!-- Botón hamburguesa para móvil -->
        <button id="mobile-menu-btn" class="mobile-menu-btn">☰</button>
    </nav>

    <!-- Menú desplegable para móvil -->
    <div id="mobile-menu" class="mobile-menu">
        <span id="mobile-user-name" class="mobile-user-name"></span>
        <button id="mobile-logout-btn" class="btn-logout">Cerrar Sesión</button>
    </div>

    <main class="main-content">

        <!-- ==================== BIENVENIDA ==================== -->
        <section class="welcome-section">
            <h2>¡Hola, <span id="welcome-name">Cargando...</span>! 👋</h2>
            <p class="welcome-text">Aquí está tu resumen de actividades</p>
        </section>

        <!-- ==================== TAREAS PRÓXIMAS ==================== -->
        <section class="upcoming-section">
            <h3>⏰ Tareas Próximas</h3>
            <div id="upcoming-tasks">
                <p class="empty-message">Cargando tareas...</p>
            </div>
        </section>

        <!-- ==================== MATERIAS ==================== -->
        <section class="subjects-section">
            <div class="section-header">
                <h3>📚 Mis Materias</h3>
                <button id="add-subject-btn" class="btn-add">+ Nueva Materia</button>
            </div>

            <!-- BUSCADOR DE MATERIAS -->
            <div class="search-container">
                <input type="text" id="search-subjects" class="search-input" placeholder="Buscar materia...">
            </div>

            <div id="subjects-list" class="subjects-grid">
                <p class="empty-message">Aún no tienes materias. ¡Crea tu primera materia!</p>
            </div>
        </section>

    </main>

    <script src="/js/utils.js"></script>
    <script src="/js/dashboard.js"></script>
</body>

</html>

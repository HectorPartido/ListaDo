<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ListaDo - Iniciar Sesión</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/utils.css">
</head>

<body>
    <div class="container">
        <h1>ListaDo 📝</h1>
        <p class="subtitle">Tu organizador universitario</p>

        <!-- BOTONES DE ALTERNANCIA -->
        <div class="form-toggle">
            <button id="show-login" class="toggle-btn active">Iniciar Sesión</button>
            <button id="show-register" class="toggle-btn">Registrarse</button>
        </div>

        <!-- FORMULARIO DE LOGIN -->
        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label for="login-email">Correo electrónico</label>
                <input type="email" id="login-email" placeholder="tu@correo.com" required>
            </div>
            <div class="form-group">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" placeholder="Tu contraseña" required minlength="6">
            </div>
            <button type="submit" class="btn-submit">Iniciar Sesión</button>
        </form>

        <!-- FORMULARIO DE REGISTRO -->
        <form id="register-form" class="auth-form" style="display: none;">
            <div class="form-group">
                <label for="register-name">Nombre completo</label>
                <input type="text" id="register-name" placeholder="Tu nombre" required>
            </div>
            <div class="form-group">
                <label for="register-email">Correo electrónico</label>
                <input type="email" id="register-email" placeholder="tu@correo.com" required>
            </div>
            <div class="form-group">
                <label for="register-password">Contraseña</label>
                <input type="password" id="register-password" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>
            <button type="submit" class="btn-submit">Registrarse</button>
        </form>

        <div id="message" class="message"></div>
    </div>

    <footer class="app-footer">
        <p>ListaDo — Desarrollado por <strong>Hector Partido Flores</strong></p>
    </footer>

    <script src="/js/utils.js"></script>
    <script src="/js/auth.js"></script>
</body>

</html>
